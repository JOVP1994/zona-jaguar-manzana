name: APK de Android

# Se ejecuta solo cada vez que cambia la app (carpetas android/ o docs/),
# o a mano desde la pestaña "Actions" → "APK de Android" → "Run workflow".
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'docs/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Revisar que la llave de firma esté configurada
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Faltan los secretos de firma (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD). Ver README."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Preparar la llave
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/llave.jks"

      - name: Compilar APK firmado
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/llave.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Renombrar
        run: cp "android/app/build/outputs/apk/release/Zona Jaguar.apk" Zona-Jaguar.apk

      - name: Publicar en "Releases"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Zona Jaguar 1.${{ github.run_number }}
          body: |
            APK de la app Zona Jaguar (versión 1.${{ github.run_number }}).
            Descarga directa siempre de la última versión:
            https://github.com/${{ github.repository }}/releases/latest/download/Zona-Jaguar.apk
          files: Zona-Jaguar.apk
          make_latest: true

      - name: Guardar copia del APK
        uses: actions/upload-artifact@v4
        with:
          name: Zona-Jaguar-apk
          path: Zona-Jaguar.apk
          retention-days: 30
